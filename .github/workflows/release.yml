name: Publicar versión

# Al subir una etiqueta  vX.Y.Z  (por ejemplo: git tag v1.1.0 && git push --tags) construye el instalador de Windows
# y lo adjunta a una Release de GitHub. Las personas que ya tienen la app instalada verán el aviso de actualización.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Comprobar que la etiqueta coincide con core/version.py
        shell: python {0}
        run: |
          import os, re, sys
          version = re.search(r'VERSION = "([^"]+)"', open("core/version.py", encoding="utf-8").read()).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("vV")
          if version != tag: sys.exit(f"La etiqueta ({tag}) no coincide con VERSION en core/version.py ({version}).")

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Construir el instalador (sin la base de datos de perfumes)
        run: python -m tools.build_installer --no-seed

      - name: Publicar la Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Perfumappte-Setup-*.exe
          generate_release_notes: true
